name: Dev Deploy app

on:
  push:
    branches: [main]
    paths:
      - "dev-app/**"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: read

concurrency:
  group: deploy-app
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: dev-app
  ECS_CLUSTER: dev-ecs-cluster
  ECS_SERVICE: dev-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (local, no AWS access yet)
        working-directory: dev-app
        run: docker build --platform linux/amd64 -t dev-app:${{ github.sha }} .

      - name: Snyk container scan
        uses: snyk/actions/docker@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: dev-app:${{ github.sha }}
          args: --file=dev-app/Dockerfile --severity-threshold=high

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::625819364285:role/GitHubActionsTerraformDev
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          IMAGE=$REGISTRY/$ECR_REPOSITORY
          docker tag dev-app:$TAG $IMAGE:$TAG
          docker tag dev-app:$TAG $IMAGE:latest
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest

      - name: Roll the ECS service
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment > /dev/null
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE