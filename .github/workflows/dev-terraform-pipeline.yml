name: terraform-dev

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply after a successful plan?"
        type: boolean
        default: false

permissions:
  id-token: write   
  contents: read

concurrency:
  group: terraform-dev  
  cancel-in-progress: false

env:
  TF_WORKSPACE: dev      
  TF_IN_AUTOMATION: "true"

jobs:
  terraform:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'  
    defaults:
      run:
        working-directory: env/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Debug OIDC claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{sub, aud, repository, ref, job_workflow_ref}'
          
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-terraform-dev-${{ github.run_id }}
          retry-max-attempts: 1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity
          aws sts get-caller-identity --query Arn --output text | grep -q "assumed-role/GitHubActionsTerraformDev/" \
            || { echo "Unexpected role"; exit 1; }

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        if: inputs.apply == true
        run: terraform apply -input=false tfplan
