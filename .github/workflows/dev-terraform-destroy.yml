name: terraform-dev-destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy-dev" to confirm'
        type: string
        required: true
      execute:
        description: "Actually destroy? (unchecked = preview only)"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-dev   # same group as the apply workflow, so they never run together
  cancel-in-progress: false

env:
  TF_WORKSPACE: dev
  TF_IN_AUTOMATION: "true"

jobs:
  destroy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'destroy-dev'
    defaults:
      run:
        working-directory: env/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-terraform-dev-destroy-${{ github.run_id }}
          retry-max-attempts: 1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity
          aws sts get-caller-identity --query Arn --output text | grep -q "assumed-role/GitHubActionsTerraformDev/" \
            || { echo "Unexpected role"; exit 1; }

      - name: Terraform init
        run: terraform init -input=false

      - name: Show current workspace
        run: |
          terraform workspace show
          terraform state list

      - name: Terraform plan (destroy)
        run: terraform plan -destroy -input=false -out=destroy.tfplan

      - name: Terraform destroy
        if: inputs.execute == true
        run: terraform apply -input=false destroy.tfplan
